      <path d="M22 0H0V22" fill="none" stroke="#C5D3E6" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="390" height="844" fill="#F7FAFF"/>
  <rect width="390" height="844" fill="url(#grid)" opacity=".7"/>

  <g fill="none" stroke="#8FA8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".42">
    <!-- triangle left -->
    <path d="M28 170 58 122 88 170Z"/><path d="M36 170h44"/>
