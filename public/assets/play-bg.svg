    <text transform="translate(250 236) rotate(8)" font-size="14">a²+b²=c²</text>
    <text x="318" y="420" font-size="28">À</text>
    <text transform="translate(36 690) rotate(6)" font-size="16">x</text>
    <text transform="translate(250 700) rotate(-7)" font-size="14">(a+b)²</text>
