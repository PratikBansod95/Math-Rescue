    <path d="M300 118h42v36H300z"/><path d="M300 118l18-14 24 14"/><path d="M318 104v14"/><path d="M342 118l-24-14"/>
    <!-- axes -->
    <path d="M42 470v-70h70"/><path d="M42 430h18M42 410h28M60 470v-18"/>
