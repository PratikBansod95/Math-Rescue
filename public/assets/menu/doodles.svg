<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" fill="none" aria-hidden="true">
  <!-- faint graph paper accents -->
  <g opacity=".14" stroke="#7EA3C9" stroke-width="1">
    <path d="M20 80h80M20 100h80M20 120h80"/>
    <path d="M40 60v80M60 60v80M80 60v80"/>
    <path d="M290 620h80M290 640h80M290 660h80"/>
    <path d="M310 600v80M330 600v80M350 600v80"/>
  </g>

  <!-- geometry & symbols -->
  <g opacity=".38" stroke="#6B90B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- right triangle -->
    <path d="M28 168l42-60 42 60Z"/>
    <path d="M38 168h64"/>
    <path d="M70 168v-28h28"/>

    <!-- 3D cube -->
    <path d="M286 108h52v44h-52z"/>
    <path d="M286 108l24-18 28 18"/>
    <path d="M310 90v18"/>
    <path d="M338 108l-28-18"/>
    <path d="M338 152l-28-18V90"/>

    <!-- angle -->
    <path d="M42 250v-42l42 42"/>
    <path d="M42 230a18 18 0 0 1 16 14"/>

    <!-- diamond -->
    <path d="M312 228l20 14-20 14-20-14z"/>

    <!-- sine wave -->
    <path d="M130 86c12-16 24 16 36 0s24 16 36 0"/>

    <!-- axes + bars -->
    <path d="M32 420v-72h78"/>
    <path d="M48 420v-28M66 420v-46M84 420v-34"/>

    <!-- parabola -->
    <path d="M268 470c18-36 36-36 54 0"/>
    <path d="M260 470h80M287 430v48"/>

    <!-- circle + diameter -->
    <circle cx="68" cy="520" r="26"/>
    <path d="M42 520h52M68 494v52"/>

    <!-- sqrt -->
    <path d="M278 520h14l12-34 18 62 16-28h28"/>

    <!-- protractor -->
    <path d="M40 640a40 40 0 0 1 80 0"/>
    <path d="M80 640v-34"/>
    <path d="M62 636l18-28 18 28"/>

    <!-- brackets -->
    <path d="M300 340c-12 0-16 10-16 22s4 22 16 22"/>
    <path d="M348 340c12 0 16 10 16 22s-4 22-16 22"/>

    <!-- fraction bar -->
    <path d="M300 700h52"/>
    <path d="M316 684h20M312 716h28"/>

    <!-- plus / times accents -->
    <path d="M170 760h28M184 746v28"/>
    <path d="M330 780l18 18M348 780l-18 18"/>

    <!-- small cylinder -->
    <ellipse cx="320" cy="580" rx="28" ry="10"/>
    <path d="M292 580v36c0 6 12 10 28 10s28-4 28-10v-36"/>
  </g>

  <!-- formulas -->
  <g fill="#6B90B8" opacity=".34" font-family="Quicksand, Fredoka, Segoe UI, sans-serif" font-weight="700">
    <text transform="translate(22 210) rotate(-11)" font-size="15">y = mx + c</text>
    <text transform="translate(248 198) rotate(8)" font-size="14">x² + y² = r²</text>
    <text transform="translate(24 300) rotate(5)" font-size="15">a² + b² = c²</text>
    <text transform="translate(250 300) rotate(-8)" font-size="16">(a + b)²</text>
    <text transform="translate(150 250) rotate(-4)" font-size="18">?</text>
    <text transform="translate(200 340) rotate(7)" font-size="14">? n</text>
    <text transform="translate(28 470) rotate(-7)" font-size="14">?ABC</text>
    <text transform="translate(250 430) rotate(6)" font-size="13">f(x) = x²</text>
    <text transform="translate(150 500) rotate(-9)" font-size="15">2x + 3 = 7</text>
    <text transform="translate(40 580) rotate(8)" font-size="14">1/2 + 1/3</text>
    <text transform="translate(250 650) rotate(-6)" font-size="14">?16 = 4</text>
    <text transform="translate(30 720) rotate(-5)" font-size="13">? = 90°</text>
    <text transform="translate(220 740) rotate(9)" font-size="14">? ? 3.14</text>
    <text transform="translate(150 160) rotate(12)" font-size="13">?</text>
    <text transform="translate(330 400) rotate(-12)" font-size="15">÷</text>
    <text transform="translate(150 620) rotate(-6)" font-size="13">n!</text>
  </g>
</svg>
