<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="body" x1="40" y1="40" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F2FF"/>
    </linearGradient>
    <linearGradient id="visor" x1="52" y1="68" x2="108" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3B82F6" flood-opacity=".22"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="142" rx="36" ry="8" fill="#B6C8E4" opacity=".45"/>

  <g filter="url(#soft)">
    <!-- antenna -->
    <rect x="72" y="18" width="16" height="22" rx="6" fill="#93C5FD"/>
    <circle cx="80" cy="18" r="8" fill="#3B82F6"/>
    <circle cx="80" cy="18" r="3.5" fill="#DBEAFE"/>

    <!-- body -->
    <rect x="42" y="42" width="76" height="84" rx="34" fill="url(#body)" stroke="#3B82F6" stroke-width="4"/>
    <!-- face screen -->
    <rect x="54" y="62" width="52" height="36" rx="16" fill="url(#visor)" opacity=".18"/>

    <!-- eyes -->
    <circle cx="66" cy="78" r="7" fill="#1E3A5F"/>
    <circle cx="68.5" cy="75.5" r="2.2" fill="#FFFFFF" opacity=".85"/>
    <path d="M88 74c6 0 11 4.5 11 9" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>

    <!-- smile -->
    <path d="M66 96c7 7 22 7 29 0" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>

    <!-- cheek -->
    <circle cx="58" cy="88" r="4" fill="#F9A8D4" opacity=".45"/>

    <!-- pointing arm -->
    <path d="M112 88c18-8 28-20 34-28" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="56" r="10" fill="#60A5FA"/>
    <circle cx="148" cy="56" r="4.5" fill="#DBEAFE"/>
  </g>
</svg>
