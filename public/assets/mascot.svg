<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="Math Rescue robot mascot">
  <defs>
    <linearGradient id="mrBody" x1="40" y1="40" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>
    <radialGradient id="mrCheek" cx="50%" cy="50%" r="50%">
      <stop stop-color="#F9A8D4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="mrSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#3B82F6" flood-opacity=".2"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="144" rx="34" ry="7.5" fill="#A8C0E0" opacity=".4">
    <animate attributeName="rx" values="34;29;34" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".4;.22;.4" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#mrSoft)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 -5; 0 0"
        dur="2.4s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
        keyTimes="0;0.5;1"/>

      <!-- antenna -->
      <g transform="translate(80 28)">
        <g>
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="-7; 9; -7"
            dur="2.8s"
            repeatCount="indefinite"
            calcMode="spline"
            keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
            keyTimes="0;0.5;1"/>
          <rect x="-5" y="-2" width="10" height="22" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3.2"/>
          <circle cx="0" cy="-7" r="7.6" fill="#3B82F6">
            <animate attributeName="r" values="7.6;8.8;7.6" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="0" cy="-7" r="3.2" fill="#EFF6FF">
            <animate attributeName="opacity" values="1;.5;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>

      <!-- body -->
      <rect x="40" y="44" width="80" height="86" rx="38" fill="url(#mrBody)" stroke="#3B82F6" stroke-width="4"/>
      <rect x="52" y="64" width="56" height="40" rx="18" fill="#60A5FA" opacity=".12"/>

      <!-- open eye + blink -->
      <circle cx="64" cy="80" r="7.2" fill="#1E3A5F"/>
      <circle cx="66.4" cy="77.4" r="2.3" fill="#FFFFFF" opacity=".92"/>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.78;0.84;0.88;1" dur="5s" repeatCount="indefinite"/>
        <rect x="54" y="71" width="20" height="18" rx="9" fill="#FFFFFF"/>
        <path d="M57 80c3.8-3.6 11.2-3.6 15 0" stroke="#1E3A5F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>

      <!-- wink eye -->
      <path d="M86 76c6.5 0 12 5 12 10" stroke="#1E3A5F" stroke-width="3.8" stroke-linecap="round" fill="none"/>

      <!-- smile -->
      <path d="M64 98c7 6.5 22 6.5 29 0" stroke="#60A5FA" stroke-width="3.4" stroke-linecap="round" fill="none">
        <animate
          attributeName="d"
          values="M64 98c7 6.5 22 6.5 29 0; M63 97c8.5 8 24 8 31 0; M64 98c7 6.5 22 6.5 29 0"
          dur="2.6s"
          repeatCount="indefinite"/>
      </path>

      <!-- blush -->
      <ellipse cx="54" cy="90" rx="5.5" ry="3.8" fill="url(#mrCheek)">
        <animate attributeName="opacity" values=".9;.5;.9" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="108" cy="90" rx="4.2" ry="3" fill="url(#mrCheek)" opacity=".5"/>

      <!-- pointing arm -->
      <g transform="translate(114 90)">
        <g>
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="-10; 14; -10"
            dur="2.1s"
            repeatCount="indefinite"
            calcMode="spline"
            keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
            keyTimes="0;0.5;1"/>
          <path d="M0 2 C12 -8 22 -20 30 -32" stroke="#3B82F6" stroke-width="7.5" stroke-linecap="round" fill="none"/>
          <circle cx="32" cy="-34" r="9.5" fill="#60A5FA">
            <animate attributeName="r" values="9.5;10.8;9.5" dur="1.05s" repeatCount="indefinite"/>
          </circle>
          <circle cx="32" cy="-34" r="4.2" fill="#DBEAFE"/>
        </g>
      </g>
    </g>
  </g>
</svg>
